name: Temporary build verification

on:
  push:
    branches:
      - ci/verify-f8-overlay

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Restore
        run: dotnet restore PhasmophobiaTools.sln

      - name: Inspect UnityEngine.Modules package
        shell: pwsh
        run: |
          Get-ChildItem "$env:USERPROFILE\.nuget\packages\unityengine.modules\2022.3.17" -Recurse |
            ForEach-Object { $_.FullName }

      - name: Build
        run: dotnet build PhasmophobiaTools.sln --configuration Release --no-restore
